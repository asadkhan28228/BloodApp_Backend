
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Email Verification - Blood Care</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #dc2626;
            font-size: 30px;
            margin: 10px 0;
        }

        h2 {
            font-size: 23px;
            color: #1e293b;
            margin-top: 25px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #fee2e2;
            border-top-color: #dc2626;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">🩸</div>

        <h1>Blood Care</h1>

        <h2 id="status">Verifying Your Email...</h2>

        <div id="loader" class="spinner"></div>

        <p id="message">
            Please wait while we verify your email address.
        </p>

        <p class="footer">
            Blood Care - Blood Donation & Emergency Response
        </p>

    </div>

    <script>
    async function verifyEmail() {

      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const loader = document.getElementById("loader");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        loader.classList.add("hidden");

        status.textContent = "Verification Failed";
        status.className = "error";

        message.textContent =
          "Verification token is missing. Please open the link sent to your email.";

        return;
      }

      try {

        const response = await fetch(
          "/api/auth/verify-email?token=" + encodeURIComponent(token),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || "Email verification failed."
          );
        }

        loader.classList.add("hidden");

        status.textContent = "Email Verified Successfully!";
        status.className = "success";

        message.textContent =
          "Your email has been verified successfully. You can now open the Blood Care app and log in.";

        // Remove verification token from browser URL
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (error) {

        loader.classList.add("hidden");

        status.textContent = "Verification Failed";
        status.className = "error";

        message.textContent =
          error.message || "Invalid or expired verification link.";

      }
    }

    verifyEmail();
    </script>

</body>
</html>
