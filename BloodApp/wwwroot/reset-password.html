<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | Blood Care</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; font-family: Arial, sans-serif; color: #0f172a; padding: 20px; }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 10px 35px rgba(15,23,42,.09); }
    h1 { color: #dc2626; margin: 0 0 8px; font-size: 27px; }
    h2 { font-size: 21px; margin: 0 0 12px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 18px 0 7px; }
    input { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 16px; }
    input:focus { outline: 2px solid #fca5a5; border-color: #dc2626; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 9px; color: white; background: #dc2626; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message { margin-top: 18px; font-size: 14px; line-height: 1.5; }
    .error { color: #b91c1c; } .success { color: #15803d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Blood Care</h1>
    <h2>Reset your password</h2>
    <p>Enter a new password for your account. This link expires 30 minutes after it is issued.</p>
    <form id="resetForm">
      <label for="password">New Password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submit" type="submit">Update Password</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submit');
    function show(text, type) { message.textContent = text; message.className = type; }
    if (!token) { show('Missing reset link token. Request a new password reset link from the app.', 'error'); button.disabled = true; }
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!token) return;
      const newPassword = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm').value;
      if (newPassword !== confirmPassword) { show('Passwords do not match.', 'error'); return; }
      button.disabled = true;
      show('Updating password...', '');
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          const details = result.errors ? Object.values(result.errors).flat().join(' ') : '';
          throw new Error(details || result.message || 'Unable to reset password. Request a new link.');
        }
        show('Password updated successfully! Open the Blood Care app and log in with your new password.', 'success');
        form.reset();
        form.style.display = 'none';
        history.replaceState(null, '', window.location.pathname);
      } catch (error) {
        show(error.message || 'Network error. Please try again.', 'error');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
